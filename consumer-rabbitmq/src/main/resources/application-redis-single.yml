# redis single的配置信息
spring:
  data:
    redis:
      # 连接超时时莫默认18000 ms
      timeout: 18000
      #
      connect-timeout: 3s
      # Redis 服务器地址
      host: 172.16.248.130
      # Redis 服务器连接端口
      prot: 6379
      # Redis 密码
      password: root
      # Redis 默认数据库 数据库编号（0~15）
      database: 0
      # lettuce url redis://[username:password@]host[:port][/database][?timeout=3s]
      url: redis://:root@172.16.248.130:6379/0
      lettuce:
        pool:
          #连接池中的最小空闲连接
          min-idle: 3
          #连接池中的最大空闲连接
          max-idle: 5
          # 连接池最大连接数（负值表示无限制）
          max-active: 100
          # 最大等待时间
          max-wait: 3000ms

  # Redisson高级配置 spring.redis.redisson
  redis:
    redisson:
      config: |  # 必须使用 | 保留换行格式
        # 单机版
        singleServerConfig:
          # 最大连接数
          connectionPoolSize: 64
          # 空闲超时 ms
          idleConnectionTimeout: 10000
          # 连接建立超时 ms
          connectTimeout: 1000
          # 命令重试次数
          retryAttempts: 3
          # 重试间隔(ms)
          retryInterval: 1500
          timeout: 3000
          password: root
          address: redis://172.16.248.130:6379
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 0
          dnsMonitoringInterval: 5000




